services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academia_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env  
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - academia_network

  db:
    image: postgres:15
    container_name: academia_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-academia}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env 
    environment:
      - POSTGRES_DB=${DB_NAME:-academia}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-1234}
    ports:
      - "5438:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - academia_network

  nginx:
    image: nginx:1.25
    container_name: academia_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web
    networks:
      - academia_network

networks:
  academia_network:
    driver: bridge

volumes:
  pgdata:
  static_volume:
